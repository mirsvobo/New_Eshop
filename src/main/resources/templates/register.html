<!DOCTYPE html>
<html lang="cs" xmlns:th="http://www.thymeleaf.org" th:replace="~{main :: layout('Registrace', ~{::section})}">
<body>
<section class="py-20 flex justify-center px-4">
    <div class="bg-white p-10 rounded-3xl shadow-xl border border-gray-100 w-full max-w-md">
        <div class="text-center mb-10">
            <h1 class="text-3xl font-black text-gray-900 tracking-tighter uppercase">Vytvořit účet</h1>
            <p class="text-gray-500 mt-2 font-medium">Získejte přehled o svých objednávkách a fakturách.</p>
        </div>
        <div th:if="${error}" class="mb-6 bg-red-50 text-red-700 p-4 rounded-xl text-sm font-bold text-center"
             th:text="${error}"></div>
        <form th:action="@{/registrace}" th:object="${user}" method="post" class="space-y-5">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest mb-2">Jméno</label>
                    <input type="text" th:field="*{firstName}" required
                           class="w-full border-gray-200 rounded-xl py-3 px-4 font-bold bg-gray-50 focus:ring-amber-500 focus:border-amber-500">
                </div>
                <div>
                    <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest mb-2">Příjmení</label>
                    <input type="text" th:field="*{lastName}" required
                           class="w-full border-gray-200 rounded-xl py-3 px-4 font-bold bg-gray-50 focus:ring-amber-500 focus:border-amber-500">
                </div>
            </div>
            <div>
                <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest mb-2">E-mailová adresa</label>
                <input type="email" th:field="*{email}" required
                       class="w-full border-gray-200 rounded-xl py-3 px-4 font-bold bg-gray-50 focus:ring-amber-500 focus:border-amber-500">
            </div>
            <div>
                <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest mb-2">Heslo</label>
                <input type="password" th:field="*{password}" required
                       class="w-full border-gray-200 rounded-xl py-3 px-4 font-bold bg-gray-50 focus:ring-amber-500 focus:border-amber-500">
            </div>
            <button type="submit"
                    class="w-full bg-slate-900 hover:bg-amber-500 hover:text-slate-900 text-white py-4 rounded-2xl font-black transition-all uppercase tracking-widest shadow-xl mt-4">
                Zaregistrovat se
            </button>
        </form>
        <p class="text-center mt-6 text-sm font-bold text-gray-500">
            Již máte účet? <a href="/login" class="text-amber-600 hover:underline">Přihlaste se</a>
        </p>
    </div>
</section>
</body>
</html>
