<!DOCTYPE html>
<html lang="cs" xmlns:th="http://www.thymeleaf.org" th:replace="~{main :: layout('Daňové sazby', ~{::section})}">
<body>

<section class="py-8 sm:py-10 w-full max-w-4xl mx-auto">
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-10">
        <div>
            <a href="/admin"
               class="text-sm font-black text-gray-400 hover:text-blue-600 uppercase tracking-widest mb-2 inline-block transition-colors"><i
                    data-lucide="arrow-left" class="w-4 h-4 inline align-text-bottom mr-1"></i> Zpět na panel</a>
            <h1 class="text-3xl sm:text-4xl font-black text-gray-900 uppercase tracking-tighter">Daňové sazby (DPH)</h1>
        </div>
        <a href="/admin/tax-rates/create"
           class="bg-cyan-600 text-white px-6 py-3 rounded-2xl font-bold hover:bg-cyan-700 hover:shadow-lg hover:-translate-y-0.5 transition-all flex items-center gap-2">
            <i data-lucide="plus" class="w-5 h-5"></i> Nová sazba
        </a>
    </div>

    <div th:if="${successMessage}"
         class="mb-6 p-4 bg-green-50 text-green-700 rounded-2xl border border-green-200 font-medium flex items-center gap-3">
        <i data-lucide="check-circle" class="w-5 h-5 text-green-500"></i>
        <span th:text="${successMessage}"></span>
    </div>

    <div th:if="${errorMessage}"
         class="mb-6 p-4 bg-red-50 text-red-700 rounded-2xl border border-red-200 font-medium flex items-center gap-3">
        <i data-lucide="alert-circle" class="w-5 h-5 text-red-500"></i>
        <span th:text="${errorMessage}"></span>
    </div>

    <div class="bg-white rounded-3xl border border-gray-100 shadow-sm overflow-hidden">
        <div class="overflow-x-auto">
            <table class="min-w-full divide-y divide-gray-100">
                <thead class="bg-gray-50/30">
                <tr>
                    <th class="px-8 py-4 text-left text-[10px] font-black text-gray-400 uppercase tracking-widest">Název
                        sazby
                    </th>
                    <th class="px-8 py-4 text-left text-[10px] font-black text-gray-400 uppercase tracking-widest">
                        Hodnota (%)
                    </th>
                    <th class="px-8 py-4 text-center text-[10px] font-black text-gray-400 uppercase tracking-widest">
                        Výchozí
                    </th>
                    <th class="px-8 py-4 text-right text-[10px] font-black text-gray-400 uppercase tracking-widest">
                        Akce
                    </th>
                </tr>
                </thead>
                <tbody class="divide-y divide-gray-50">
                <tr th:each="taxRate : ${taxRates}" class="hover:bg-gray-50/50 transition-colors group">
                    <td class="px-8 py-5 whitespace-nowrap text-sm font-bold text-gray-900" th:text="${taxRate.name}">
                        Základní
                    </td>
                    <td class="px-8 py-5 whitespace-nowrap">
                        <span class="text-lg font-black text-cyan-600 bg-cyan-50 px-3 py-1 rounded-lg"
                              th:text="${taxRate.rate + ' %'}">21 %</span>
                    </td>
                    <td class="px-8 py-5 whitespace-nowrap text-center">
                        <span th:if="${taxRate.defaultRate}"
                              class="px-3 py-1 inline-flex text-[10px] font-black rounded-full bg-green-100 text-green-700 uppercase tracking-widest">Ano</span>
                        <span th:unless="${taxRate.defaultRate}" class="text-slate-300">-</span>
                    </td>
                    <td class="px-8 py-5 whitespace-nowrap text-right">
                        <div class="flex justify-end gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                            <a th:href="@{'/admin/tax-rates/edit/' + ${taxRate.id}}"
                               class="p-2 text-blue-600 hover:bg-blue-50 rounded-xl transition-colors" title="Upravit">
                                <i data-lucide="edit-2" class="w-5 h-5"></i>
                            </a>
                            <a th:href="@{'/admin/tax-rates/delete/' + ${taxRate.id}}"
                               class="p-2 text-red-600 hover:bg-red-50 rounded-xl transition-colors"
                               onclick="return confirm('Opravdu chcete smazat tuto sazbu DPH? Může to ovlivnit produkty.');"
                               title="Smazat">
                                <i data-lucide="trash-2" class="w-5 h-5"></i>
                            </a>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(taxRates)}">
                    <td colspan="4" class="px-8 py-20 text-center">
                        <i data-lucide="percent" class="w-12 h-12 mx-auto text-slate-200 mb-4"></i>
                        <p class="text-sm font-bold text-gray-400 uppercase tracking-widest">Žádné sazby DPH v
                            systému</p>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>

</body>
</html>
