<!DOCTYPE html>
<html lang="cs" xmlns:th="http://www.thymeleaf.org" th:replace="~{main :: layout('Správa Kusovníku', ~{::section})}">
<body>

<section class="py-8 max-w-4xl mx-auto">
    <div class="mb-8">
        <a href="/admin/produkty"
           class="text-sm font-bold text-slate-400 hover:text-slate-900 flex items-center gap-2 uppercase tracking-widest mb-4">
            <i data-lucide="arrow-left" class="w-4 h-4"></i> Zpět na produkty
        </a>
        <h1 class="text-3xl font-black text-gray-900 uppercase tracking-tighter"
            th:text="'Kusovník: ' + ${product.name}"></h1>
        <p class="text-slate-500 mt-2">Definujte suroviny potřebné pro výrobu jednoho kusu tohoto produktu.</p>
    </div>

    <div th:if="${success}"
         class="mb-6 bg-green-50 border-l-4 border-green-500 p-4 rounded-xl flex items-center gap-3 shadow-sm">
        <i data-lucide="check-circle" class="text-green-600"></i>
        <p class="text-sm text-green-800 font-bold" th:text="${success}"></p>
    </div>
    <div th:if="${error}"
         class="mb-6 bg-red-50 border-l-4 border-red-500 p-4 rounded-xl flex items-center gap-3 shadow-sm">
        <i data-lucide="alert-circle" class="text-red-600"></i>
        <p class="text-sm text-red-800 font-bold" th:text="${error}"></p>
    </div>

    <div class="bg-white rounded-3xl shadow-sm border border-gray-100 overflow-hidden mb-8">
        <table class="min-w-full divide-y divide-gray-100">
            <thead class="bg-gray-50">
            <tr>
                <th class="px-6 py-4 text-left text-[10px] font-black text-gray-400 uppercase tracking-widest">
                    Surovina
                </th>
                <th class="px-6 py-4 text-center text-[10px] font-black text-gray-400 uppercase tracking-widest">
                    Množství na 1 ks
                </th>
                <th class="px-6 py-4 text-right text-[10px] font-black text-gray-400 uppercase tracking-widest">Akce
                </th>
            </tr>
            </thead>
            <tbody class="divide-y divide-gray-50">
            <tr th:each="item : ${product.recipe}">
                <td class="px-6 py-4 text-sm font-bold text-gray-900" th:text="${item.material.name}"></td>
                <td class="px-6 py-4 text-center text-sm font-black text-blue-600"
                    th:text="${item.quantity + ' ' + item.material.unit}"></td>
                <td class="px-6 py-4 text-right">
                    <form th:action="@{/admin/produkty/kusovnik/odebrat/{recipeId}(recipeId=${item.id})}" method="post"
                          class="inline">
                        <input type="hidden" name="productId" th:value="${product.id}">
                        <button type="submit" class="text-red-400 hover:text-red-600"><i data-lucide="trash-2"
                                                                                         class="w-5 h-5"></i></button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(product.recipe)}">
                <td colspan="3" class="px-6 py-12 text-center text-gray-400">Produkt zatím nemá definován žádný
                    kusovník. (Pro výrobu nebude odečten materiál)
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="bg-slate-50 rounded-3xl p-6 border border-slate-100">
        <h3 class="text-sm font-black text-gray-900 uppercase tracking-widest mb-4"><i data-lucide="plus-circle"
                                                                                       class="w-4 h-4 inline mb-1"></i>
            Přidat surovinu</h3>
        <form th:action="@{/admin/produkty/{id}/kusovnik/pridat(id=${product.id})}" method="post"
              class="flex gap-4 items-end">
            <div class="flex-grow">
                <label class="block text-[10px] font-black text-slate-400 uppercase mb-2">Výběr materiálu ze
                    skladu</label>
                <select name="materialId" required class="w-full border-gray-200 rounded-xl py-3 px-4 font-bold">
                    <option th:each="m : ${materials}" th:value="${m.id}"
                            th:text="${m.name + ' (Skladem: ' + m.stockQuantity + ' ' + m.unit + ')'}"></option>
                </select>
            </div>
            <div class="w-32">
                <label class="block text-[10px] font-black text-slate-400 uppercase mb-2">Počet</label>
                <input type="number" name="quantity" required min="1"
                       class="w-full border-gray-200 rounded-xl py-3 px-4 font-bold">
            </div>
            <button type="submit"
                    class="bg-slate-900 text-white py-3 px-6 rounded-xl font-black hover:bg-slate-800 transition-all uppercase text-sm">
                Vložit
            </button>
        </form>
    </div>
</section>

</body>
</html>
