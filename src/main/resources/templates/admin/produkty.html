<!DOCTYPE html>
<html lang="cs" xmlns:th="http://www.thymeleaf.org" th:replace="~{main :: layout('Správa produktů', ~{::section})}">
<body>

<section class="py-8">
    <a href="/admin"
       class="inline-flex items-center text-sm font-bold text-slate-400 hover:text-slate-900 mb-6 transition-colors uppercase tracking-widest gap-2">
        <i data-lucide="arrow-left" class="w-4 h-4"></i> Zpět na řídící panel
    </a>

    <div class="mb-8 sm:flex sm:items-center sm:justify-between">
        <div>
            <h1 class="text-3xl font-black text-gray-900 tracking-tight uppercase">Správa položek a materiálů</h1>
            <p class="mt-1 text-sm text-gray-500">Zde můžete přidávat, upravovat nebo mazat položky skladu a
                e-shopu.</p>
        </div>
        <div class="mt-4 sm:mt-0">
            <a th:href="@{/admin/produkty/novy}"
               class="inline-flex items-center justify-center px-5 py-3 border border-transparent text-sm font-black rounded-xl shadow-lg text-white bg-green-600 hover:bg-green-700 transition-all gap-2 uppercase tracking-widest">
                <i data-lucide="plus-circle" class="w-5 h-5"></i> Přidat položku
            </a>
        </div>
    </div>

    <div th:if="${success}"
         class="mb-6 bg-green-50 border-l-4 border-green-500 p-4 rounded-xl flex items-center gap-3 shadow-sm">
        <i data-lucide="check-circle" class="text-green-600"></i>
        <p class="text-sm text-green-800 font-bold" th:text="${success}"></p>
    </div>

    <form method="get" th:action="@{/admin/produkty}"
          class="mb-6 bg-white p-5 rounded-3xl shadow-sm border border-gray-100 flex flex-col md:flex-row gap-4 md:items-end">
        <div class="flex-1">
            <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest mb-2">Hledat v
                katalogu</label>
            <input type="text" name="search" th:value="${currentSearch}" placeholder="Název nebo popis..."
                   class="w-full border-gray-200 rounded-xl py-2.5 px-4 text-sm font-medium focus:ring-blue-500 outline-none">
        </div>

        <div class="w-full md:w-40">
            <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest mb-2">Typ položky</label>
            <select name="type"
                    class="w-full border-gray-200 rounded-xl py-2.5 px-4 text-sm font-medium focus:ring-blue-500 outline-none">
                <option value="">Vše (Katalog)</option>
                <option th:each="t : ${productTypes}" th:value="${t}"
                        th:text="${t.name() == 'PRODUCT' ? 'Výrobky' : 'Suroviny'}"
                        th:selected="${currentType == t}"></option>
            </select>
        </div>

        <div class="w-full md:w-40">
            <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest mb-2">Stav</label>
            <select name="active"
                    class="w-full border-gray-200 rounded-xl py-2.5 px-4 text-sm font-medium focus:ring-blue-500 outline-none">
                <option value="">Všechny</option>
                <option value="true" th:selected="${currentActive == true}">Aktivní</option>
                <option value="false" th:selected="${currentActive == false}">Neaktivní (Skryté)</option>
            </select>
        </div>

        <div class="w-full md:w-48">
            <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest mb-2">Řadit podle</label>
            <select name="sort"
                    class="w-full border-gray-200 rounded-xl py-2.5 px-4 text-sm font-medium focus:ring-blue-500 outline-none">
                <option value="name_asc" th:selected="${currentSort == 'name_asc'}">Abecedně (A-Z)</option>
                <option value="name_desc" th:selected="${currentSort == 'name_desc'}">Abecedně (Z-A)</option>
                <option value="price_asc" th:selected="${currentSort == 'price_asc'}">Nejlevnější</option>
                <option value="price_desc" th:selected="${currentSort == 'price_desc'}">Nejdražší</option>
                <option value="stock_asc" th:selected="${currentSort == 'stock_asc'}">Skladem (nejméně)</option>
                <option value="stock_desc" th:selected="${currentSort == 'stock_desc'}">Skladem (nejvíce)</option>
            </select>
        </div>

        <div class="flex gap-2">
            <button type="submit"
                    class="px-6 py-2.5 bg-slate-900 text-white rounded-xl font-bold text-sm hover:bg-blue-600 transition-colors">
                Filtrovat
            </button>
            <a th:href="@{/admin/produkty}"
               th:if="${currentSearch != null or currentType != null or currentActive != null or currentSort != 'name_asc'}"
               title="Zrušit filtry"
               class="px-4 py-2.5 border border-gray-200 text-gray-600 rounded-xl font-bold text-sm hover:bg-gray-50 transition-colors flex items-center justify-center">
                <i data-lucide="x" class="w-4 h-4"></i>
            </a>
        </div>
    </form>

    <div class="bg-white shadow-sm rounded-3xl border border-gray-100 overflow-hidden">
        <div class="overflow-x-auto">
            <table class="min-w-full divide-y divide-gray-100">
                <thead class="bg-gray-50">
                <tr>
                    <th scope="col"
                        class="px-6 py-4 text-left text-[10px] font-black text-gray-400 uppercase tracking-widest">Název
                        a Typ
                    </th>
                    <th scope="col"
                        class="px-6 py-4 text-left text-[10px] font-black text-gray-400 uppercase tracking-widest">
                        Skladem
                    </th>
                    <th scope="col"
                        class="px-6 py-4 text-left text-[10px] font-black text-gray-400 uppercase tracking-widest">Cena
                    </th>
                    <th scope="col"
                        class="px-6 py-4 text-right text-[10px] font-black text-gray-400 uppercase tracking-widest">Akce
                    </th>
                </tr>
                </thead>
                <tbody class="bg-white divide-y divide-gray-50">
                <tr th:each="product : ${products}" class="hover:bg-gray-50/50 transition-colors">

                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 rounded-xl bg-slate-50 flex-shrink-0 overflow-hidden border border-slate-100 flex items-center justify-center">
                                <img th:src="${product.getDisplayImageUrl()}" class="w-full h-full object-cover"
                                     th:alt="${product.name}">
                            </div>
                            <div>
                                <div class="text-sm font-bold text-gray-900" th:text="${product.name}">Název</div>
                                <div class="mt-1 space-x-1 flex items-center">
                                    <span th:if="${!product.active}"
                                          class="px-2 py-0.5 inline-flex text-[10px] leading-none font-black rounded-full bg-slate-100 text-slate-500 uppercase tracking-widest">Skrytý</span>
                                    <span th:if="${product.type.name() == 'PRODUCT'}"
                                          class="px-2 py-0.5 inline-flex text-[10px] leading-none font-black rounded-full bg-blue-100 text-blue-800 uppercase tracking-widest">Výrobek</span>
                                    <span th:if="${product.type.name() == 'MATERIAL'}"
                                          class="px-2 py-0.5 inline-flex text-[10px] leading-none font-black rounded-full bg-yellow-100 text-yellow-800 uppercase tracking-widest">Surovina</span>
                                </div>
                            </div>
                        </div>
                    </td>

                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="text-sm text-slate-700 font-black bg-slate-50 inline-flex px-3 py-1.5 rounded-lg border border-slate-100"
                             th:text="${#numbers.formatInteger(product.stockQuantity, 0) + ' ' + product.unit}">0 ks
                        </div>
                    </td>

                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="text-sm font-black text-gray-900"
                             th:text="${#numbers.formatInteger(product.price, 1, 'WHITESPACE')} + ' Kč (bez DPH)'"></div>
                        <div class="text-xs font-bold text-gray-400 mt-1"
                             th:text="${#numbers.formatInteger(product.getPriceWithTax(), 1, 'WHITESPACE')} + ' Kč (s DPH)'"></div>
                    </td>

                    <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                        <div class="flex justify-end gap-2 items-center">

                            <a th:if="${product.type.name() == 'PRODUCT'}"
                               th:href="@{/admin/produkty/{id}/kusovnik(id=${product.id})}"
                               class="text-indigo-600 hover:text-indigo-900 hover:bg-indigo-100 transition-all flex items-center gap-2 font-black text-[10px] uppercase tracking-widest border border-indigo-200 bg-indigo-50 px-3 py-2 rounded-xl">
                                <i data-lucide="list-tree" class="w-4 h-4"></i> Kusovník
                            </a>

                            <a th:href="@{/admin/produkty/edit/{id}(id=${product.id})}"
                               class="p-2 text-blue-400 hover:text-blue-600 hover:bg-blue-50 rounded-xl transition-all"
                               title="Upravit">
                                <i data-lucide="edit-3" class="w-5 h-5"></i>
                            </a>

                            <form th:action="@{/admin/produkty/delete/{id}(id=${product.id})}" method="post"
                                  onsubmit="return confirm('Opravdu trvale smazat tuto položku?');" class="inline">
                                <button type="submit"
                                        class="p-2 text-red-300 hover:text-red-600 hover:bg-red-50 rounded-xl transition-all"
                                        title="Smazat">
                                    <i data-lucide="trash-2" class="w-5 h-5"></i>
                                </button>
                            </form>

                        </div>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(products)}">
                    <td colspan="4" class="px-6 py-16 text-center">
                        <i data-lucide="package-x" class="w-12 h-12 mx-auto mb-3 text-slate-300"></i>
                        <span class="font-black text-sm uppercase tracking-widest text-slate-400">Katalog je prázdný</span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>

</body>
</html>
