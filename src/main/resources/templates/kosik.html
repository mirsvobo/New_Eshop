<!DOCTYPE html>
<html lang="cs" xmlns:th="http://www.thymeleaf.org" th:replace="~{main :: layout('Nákupní košík', ~{::section})}">
<body>

<section class="py-8 sm:py-12 w-full">
    <h1 class="text-2xl sm:text-3xl font-black text-gray-900 tracking-tighter uppercase mb-6 sm:mb-8">Nákupní košík</h1>

    <div th:if="${#lists.isEmpty(cartItems)}"
         class="text-center py-16 sm:py-20 bg-white rounded-3xl border border-gray-100 shadow-sm px-4">
        <i data-lucide="shopping-cart" class="w-12 h-12 sm:w-16 sm:h-16 mx-auto text-gray-300 mb-4"></i>
        <h2 class="text-lg sm:text-xl font-black text-gray-900 uppercase tracking-widest">Váš košík je prázdný</h2>
        <p class="text-sm sm:text-base text-gray-500 mt-2 mb-6">Zatím jste do košíku nepřidali žádné produkty.</p>
        <a href="/produkty"
           class="inline-flex bg-slate-900 text-white px-5 sm:px-6 py-3 rounded-xl font-black hover:bg-blue-600 transition-colors uppercase tracking-widest text-xs sm:text-sm shadow-lg">
            Přejít do obchodu
        </a>
    </div>

    <div th:unless="${#lists.isEmpty(cartItems)}" class="grid grid-cols-1 lg:grid-cols-3 gap-6 sm:gap-8">

        <div class="lg:col-span-2">
            <div class="bg-white rounded-3xl shadow-sm border border-gray-100 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-100">
                        <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-5 text-left text-[10px] font-black text-gray-400 uppercase tracking-widest">
                                Produkt
                            </th>
                            <th class="px-6 py-5 text-center text-[10px] font-black text-gray-400 uppercase tracking-widest">
                                Množství
                            </th>
                            <th class="px-6 py-5 text-right text-[10px] font-black text-gray-400 uppercase tracking-widest">
                                Cena (vč. DPH)
                            </th>
                            <th class="px-6 py-5 text-right text-[10px] font-black text-gray-400 uppercase tracking-widest"></th>
                        </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-50">
                        <tr th:each="item : ${cartItems}" class="hover:bg-gray-50/50 transition-colors">
                            <td class="px-6 py-5">
                                <div class="text-sm font-bold text-gray-900" th:text="${item.productName}"></div>
                                <div class="text-[10px] sm:text-xs font-bold text-gray-400 mt-1"
                                     th:text="${#numbers.formatDecimal(item.price, 1, 'WHITESPACE', 0, 'COMMA')} + ' Kč / ks'"></div>

                                <div th:if="${item.requiresManufacturing}" class="mt-2.5 flex items-start gap-1.5">
                                    <div class="bg-amber-50 border border-amber-200 text-amber-700 px-2 py-1 rounded-md inline-flex items-center gap-1.5">
                                        <i data-lucide="hammer" class="w-3 h-3"></i>
                                        <div class="flex flex-col">
                                            <span class="text-[9px] font-black uppercase tracking-widest leading-none">Bude zadáno do výroby</span>
                                            <span class="text-[9px] font-bold opacity-80 mt-0.5" th:text="'Skladem pouze ' + ${#numbers.formatDecimal(item.stockQuantity, 1, 0)} + ' ks'"></span>
                                        </div>
                                    </div>
                                </div>
                            </td>
                            <td class="px-6 py-5 text-center align-top pt-5">
                                <form th:action="@{/kosik/upravit}" method="post" class="inline-flex mt-1">
                                    <input type="hidden" name="productId" th:value="${item.productId}">
                                    <input type="number" name="quantity" th:value="${item.quantity}" min="0"
                                           onchange="this.form.submit()"
                                           class="w-16 text-center text-xs sm:text-sm font-black text-blue-600 bg-blue-50 px-2 py-1 rounded-lg border border-blue-200 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
                                </form>
                            </td>
                            <td class="px-6 py-5 text-right text-sm font-black text-gray-900 whitespace-nowrap align-top pt-6"
                                th:text="${#numbers.formatDecimal(item.price * item.quantity, 1, 'WHITESPACE', 0, 'COMMA')} + ' Kč'"></td>
                            <td class="px-6 py-5 text-right align-top pt-5">
                                <form th:action="@{/kosik/odstranit}" method="post" class="inline mt-1">
                                    <input type="hidden" name="productId" th:value="${item.productId}">
                                    <button type="submit"
                                            class="p-2 text-red-300 hover:text-red-600 hover:bg-red-50 rounded-lg transition-colors">
                                        <i data-lucide="trash-2" class="w-5 h-5"></i>
                                    </button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <div class="p-5 border-t border-gray-100 bg-gray-50 flex justify-end">
                    <form th:action="@{/kosik/vycistit}" method="post">
                        <button type="submit"
                                class="text-xs font-bold text-gray-400 hover:text-red-600 uppercase tracking-widest flex items-center gap-1.5 transition-colors">
                            <i data-lucide="x" class="w-3.5 h-3.5"></i> Vysypat košík
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <div class="lg:col-span-1">
            <div class="bg-gray-50 rounded-3xl p-6 sm:p-8 border border-gray-200 lg:sticky lg:top-24 shadow-sm">
                <h3 class="text-xs sm:text-sm font-black text-gray-900 uppercase tracking-widest mb-6">Shrnutí
                    objednávky</h3>

                <div class="flex justify-between items-center mb-4 text-sm">
                    <span class="font-bold text-gray-500">Hodnota zboží</span>
                    <span class="font-black text-gray-900"
                          th:text="${#numbers.formatDecimal(cartTotal, 1, 'WHITESPACE', 0, 'COMMA')} + ' Kč'"></span>
                </div>
                <div class="flex justify-between items-center mb-6 text-sm">
                    <span class="font-bold text-gray-500">Doprava</span>
                    <span class="font-black text-gray-400 text-xs uppercase tracking-widest">v dalším kroku</span>
                </div>

                <div class="border-t border-gray-200 pt-6 mb-6 flex justify-between items-center text-lg sm:text-xl">
                    <span class="font-black text-gray-900 uppercase">Mezisoučet</span>
                    <span class="font-black text-blue-600"
                          th:text="${#numbers.formatDecimal(cartTotal, 1, 'WHITESPACE', 0, 'COMMA')} + ' Kč'"></span>
                </div>

                <a href="/kosik/pokladna"
                   class="block text-center w-full bg-slate-900 text-white py-4 rounded-2xl font-black hover:bg-blue-600 transition-all uppercase tracking-widest shadow-xl text-sm">
                    Přejít k pokladně
                </a>
            </div>
        </div>
    </div>
</section>

</body>
</html>
