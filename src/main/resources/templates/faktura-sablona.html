<!DOCTYPE html>
<html lang="cs" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Faktura - FajnDřevo s.r.o.</title>
    <style>
        @page {
            size: A4;
            margin: 0;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            color: #1e293b;
            background: #f1f5f9;
            margin: 0;
            padding: 0;
        }

        .invoice-box {
            max-width: 800px;
            margin: 40px auto;
            padding: 50px;
            background: #fff;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        .header {
            display: flex;
            justify-content: space-between;
            border-bottom: 4px solid #0f172a;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            margin-bottom: 40px;
        }

        h3 {
            font-size: 0.7rem;
            text-transform: uppercase;
            color: #64748b;
            margin-bottom: 10px;
            border-bottom: 1px solid #e2e8f0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 30px;
        }

        th {
            text-align: left;
            padding: 12px;
            font-size: 0.7rem;
            text-transform: uppercase;
            background: #f8fafc;
            border-bottom: 2px solid #e2e8f0;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #f1f5f9;
            font-size: 0.85rem;
        }

        .tax-summary {
            width: 45%;
            margin-left: auto;
        }

        .total-box {
            background: #0f172a;
            color: #fff;
            padding: 15px;
            font-weight: 900;
            font-size: 1.2rem;
            text-align: right;
            border-radius: 8px;
        }
    </style>
</head>
<body>
<div class="invoice-box">
    <div class="header">
        <h1>FAKTURA</h1>
        <div style="text-align: right">
            <strong>Číslo: <span th:text="${order.orderNumber}"></span></strong><br>
            Vystaveno: <span th:text="${#temporals.format(order.createdAt, 'dd.MM.yyyy')}"></span>
        </div>
    </div>

    <div class="grid">
        <div>
            <h3>Dodavatel</h3>
            <strong>FajnDřevo s.r.o.</strong><br>
            Dřevařská 123, 500 02 Hradec Králové<br>
            IČ: 12345678 | DIČ: CZ12345678
        </div>
        <div>
            <h3>Odběratel</h3>
            <strong th:text="${order.getCustomerFullName()}"></strong><br>
            <span th:text="${order.billingAddress}"></span><br>
            <span th:if="${order.ico}" th:text="'IČ: ' + ${order.ico} + ' | DIČ: ' + ${order.dic}"></span>
        </div>
    </div>

    <table>
        <thead>
        <tr>
            <th>Položka</th>
            <th>Množství</th>
            <th style="text-align: right">Cena/ks</th>
            <th style="text-align: right">Celkem s DPH</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${order.items}">
            <td th:text="${item.product.name}"></td>
            <td th:text="${item.quantity} + ' ' + ${item.product.unit}"></td>
            <td style="text-align: right"
                th:text="${#numbers.formatDecimal(item.unitPrice, 1, 'WHITESPACE', 0, 'COMMA')} + ' Kč'"></td>
            <td style="text-align: right; font-weight: 700;"
                th:text="${#numbers.formatDecimal(item.unitPrice * item.quantity, 1, 'WHITESPACE', 0, 'COMMA')} + ' Kč'"></td>
        </tr>
        </tbody>
    </table>

    <div style="display: flex; justify-content: space-between; align-items: flex-start;">
        <div style="font-size: 0.8rem; color: #64748b;">
            <p><strong>Doručovací adresa:</strong><br>
                <span th:text="${order.deliveryAddress}"></span></p>
        </div>
        <div class="tax-summary">
            <table style="font-size: 0.75rem; margin-bottom: 10px;">
                <tr th:each="entry : ${taxSummary}">
                    <td th:text="'Základ DPH ' + ${#numbers.formatDecimal(entry.key, 1, 0)} + '%'"></td>
                    <td style="text-align: right"
                        th:text="${#numbers.formatDecimal(entry.value['base'], 1, 'WHITESPACE', 0, 'COMMA')} + ' Kč'"></td>
                </tr>
                <tr th:each="entry : ${taxSummary}">
                    <td th:text="'Daň DPH ' + ${#numbers.formatDecimal(entry.key, 1, 0)} + '%'"></td>
                    <td style="text-align: right"
                        th:text="${#numbers.formatDecimal(entry.value['tax'], 1, 'WHITESPACE', 0, 'COMMA')} + ' Kč'"></td>
                </tr>
                <tr>
                    <td>Doprava</td>
                    <td style="text-align: right">150 Kč</td>
                </tr>
            </table>
            <div class="total-box">
                CELKEM: <span
                    th:text="${#numbers.formatDecimal(order.totalAmount, 1, 'WHITESPACE', 0, 'COMMA')} + ' Kč'"></span>
            </div>
        </div>
    </div>
</div>
</body>
</html>
